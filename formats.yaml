# Specs por formato de entrega. Fonte única: lida pelo `vf` (qa, export) e pelas skills.
# Durações em segundos, safe_zone em px no tamanho nativo (área coberta pela interface do app; aproximada).
yt-long:
  platform: youtube
  label: "YouTube vídeo longo"
  aspect: "16:9"
  width: 1920
  height: 1080
  alt_sizes: [[3840, 2160], [2560, 1440]]
  fps: [24, 25, 30, 50, 60]
  duration: { min: 240, max: 3600, target: 720 }
  wpm: 160            # narração explicativa longa: 150-170 palavras/min
  lufs: -14
  true_peak: -1.0
  lufs_tolerance: 0.5
  video: { codec: h264, crf: 16, preset: slow, pix_fmt: yuv420p }
  audio: { codec: aac, bitrate: 320k, sample_rate: 48000 }
  safe_zone: { top: 0, bottom: 0, left: 0, right: 0 }
  qa:
    freeze_frames: 12
    duration_strict: [480, 1200]   # o vídeo longo da fábrica mira 10-15 min
    min_life: 0.003                # zoom-in leve (>= 1,05 por plano de 7 s) passa; still parado não
    max_shot_s: 9
    max_bitrate_mbps: 16
    audio_start_s: 0.3
    hook_s: 3
    max_silence_s: 1.0
    max_voice_gap_s: 2.0
    repeat_window_s: 120

yt-short:
  platform: youtube
  label: "YouTube Shorts"
  aspect: "9:16"
  width: 1080
  height: 1920
  alt_sizes: [[1440, 2560], [2160, 3840]]
  fps: [24, 25, 30, 60]
  duration: { min: 15, max: 180, target: 60 }
  wpm: 222            # ~3,7 palavras/s (fórmula roteiro-short-explicativo)
  lufs: -14
  true_peak: -1.0
  lufs_tolerance: 0.5
  video: { codec: h264, crf: 16, preset: slow, pix_fmt: yuv420p }
  audio: { codec: aac, bitrate: 320k, sample_rate: 48000 }
  safe_zone: { top: 140, bottom: 380, left: 40, right: 120 }
  qa:
    freeze_frames: 8
    duration_strict: [30, 75]      # fórmula de short explicativo: 30-70 s
    min_life: 0.008
    max_shot_s: 6
    max_bitrate_mbps: 24           # 1440x2560 h264 crf 16 fica em ~10-18 Mb/s
    audio_start_s: 0.2
    hook_s: 2
    max_silence_s: 0.6
    max_voice_gap_s: 1.0
    repeat_window_s: 0

tiktok:
  platform: tiktok
  label: "TikTok"
  aspect: "9:16"
  width: 1080
  height: 1920
  alt_sizes: []
  fps: [24, 25, 30, 60]
  duration: { min: 7, max: 600, target: 35 }
  wpm: 222
  lufs: -14
  true_peak: -1.0
  lufs_tolerance: 0.5
  video: { codec: h264, crf: 17, preset: slow, pix_fmt: yuv420p }
  audio: { codec: aac, bitrate: 256k, sample_rate: 48000 }
  safe_zone: { top: 160, bottom: 480, left: 60, right: 140 }
  qa:
    freeze_frames: 8
    duration_strict: [21, 60]      # alvo 35 s; acima de 60 s o TikTok perde conclusão
    min_life: 0.008
    max_shot_s: 5
    max_bitrate_mbps: 12
    audio_start_s: 0.2
    hook_s: 1.5
    max_silence_s: 0.6
    max_voice_gap_s: 1.0
    repeat_window_s: 0
