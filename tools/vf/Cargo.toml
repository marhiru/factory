[package]
name = "vf"
version = "0.1.0"
edition = "2021"
description = "video-factory: análise, transcrição, QA e export de vídeo de alta performance"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rayon = "1"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Keychain (vf studio): segredo direto pela API do macOS, sem passar pela linha de comando
security-framework = "2.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
